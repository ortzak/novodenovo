map $http_user_agent $robo_previa {
    default 0;
    "~*(whatsapp|facebookexternalhit|facebot|telegrambot|twitterbot|linkedinbot|discordbot|slackbot|skypeuripreview|pinterest|googlebot|bingbot)" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|webm|mp4)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ ^/notebook/([A-Za-z0-9-]+)/?$ {
        if ($robo_previa) {
            rewrite ^/notebook/([A-Za-z0-9-]+)/?$ /api/compartilhar/notebook/$1 last;
        }
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
