spring.application.name=novodenovo-api
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vitrine_notebooks?serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.cors.origens=${CORS_ORIGENS:http://localhost:4200}

app.site-url=${SITE_URL:http://localhost:4200}
