services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: vitrine_notebooks
      MYSQL_USER: novodenovo
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      TZ: America/Sao_Paulo
    volumes:
      - db-dados:/var/lib/mysql
      - ./banco/banco.sql:/docker-entrypoint-initdb.d/01-banco.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://db:3306/vitrine_notebooks?serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: novodenovo
      DB_PASSWORD: ${DB_PASSWORD}
      SITE_URL: https://${DOMINIO:-localhost}
      JWT_SEGREDO: ${JWT_SEGREDO:-}
      FOTOS_PASTA: /dados/fotos
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx768m
      TZ: America/Sao_Paulo
    volumes:
      - fotos:/dados/fotos
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  db-dados:
  fotos:
  caddy-dados:
  caddy-config:
